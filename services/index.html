    function render(filter = '') {
      const grid = document.getElementById('servicesGrid');
      grid.innerHTML = services
        .filter(s => s.title.toLowerCase().includes(filter.toLowerCase()) || s.desc.toLowerCase().includes(filter.toLowerCase()))
        .map(s => `
          <a href="/services/${s.slug}/" class="group flex flex-col h-full bg-[#0b3330]/60 border border-emerald-800/60 rounded-2xl p-6 hover:bg-[#0e3330] hover:border-[#00b341] transition-all duration-300 shadow-md">

              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">${s.icon}</svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-3 group-hover:text-[#00b341] transition-colors">${s.title}</h3>
            <p class="text-slate-300 text-sm leading-relaxed flex-grow">${s.desc}</p>
          </a>
        `).join('');

    document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));
