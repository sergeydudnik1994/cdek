<!DOCTYPE html>
<html lang="ru">
<head>
  <!--#include virtual="/src/components/metrika.html" -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Все услуги СДЭК для селлеров | Полный каталог логистики</title>
  <meta name="description" content="Каталог B2B услуг СДЭК: FBS, DBS, фулфилмент, КГТ, страхование и аналитика. Все решения для маркетплейсов в одном месте." />

  <meta name="theme-color" content="#8DE21A" />
  <link rel="canonical" href="https://cdek-marketplace.ru/services/" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cdek: '#8de21a', dark: { 900: '#0b101d' } } } }
    }
  </script>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col antialiased pb-16 md:pb-0">

  <!--#include virtual="/src/components/header.html" -->

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-20 w-full">
    
    <div class="mb-12 text-center">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Услуги для селлеров</h1>
      <p class="text-slate-400 text-lg max-w-2xl mx-auto">Полный спектр логистических решений СДЭК для вашего бизнеса на маркетплейсах.</p>
    </div>

    <div class="mb-12 max-w-xl mx-auto">
      <input type="text" id="searchInput" placeholder="Поиск по названию или описанию..." 
             class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-6 py-4 text-white focus:outline-none focus:border-cdek transition-all shadow-lg" />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="servicesGrid">
      
      <!-- Сюда скрипт ниже подставит все 24 карточки -->

    </div>
  </main>

  <!--#include virtual="/src/components/footer.html" -->
  <!--#include virtual="/src/components/mobile-cta.html" -->

  <script>
    const allServices = [
      { slug: "fbs", title: "Подключение по FBS", desc: "Отгрузка со своего склада до ПВЗ. Быстрая доставка до маркетплейсов со скидкой." },
      { slug: "dbs", title: "Спецтариф DBS", desc: "Доставка напрямую до двери покупателя. Специальные тарифы для посылок до 1 кг." },
      { slug: "dogovor-ip", title: "Договор для ИП", desc: "Бесплатное заключение корпоративного договора для селлеров за 15 минут." },
      { slug: "samozanyatye", title: "Договор для самозанятых", desc: "Официальное партнерство со СДЭК для плательщиков НПД без бюрократии." },
      { slug: "unit-economy", title: "Юнит-экономика", desc: "Инструменты для просчета рентабельности и тарифов для разных габаритов." },
      { slug: "fulfillment", title: "Фулфилмент под ключ", desc: "Хранение, бережная упаковка и доставка заказов селлеров до маркетплейсов." },
      { slug: "cross-docking", title: "Кросс-докинг", desc: "Транзитная перевалка коробов и паллет на склады маркетплейсов без хранения." },
      { slug: "zabor-gruza", title: "Забор груза от склада", desc: "Ежедневный выезд курьера за вашими отправлениями для экономии времени." },
      { slug: "ltl-shipping", title: "LTL (Сборные грузы )", desc: "Экономичная доставка крупных партий товаров паллетами и коробами по всей РФ." },
      { slug: "kgt-delivery", title: "Доставка КГТ", desc: "Специальные тарифы и условия на перевозку крупногабаритных товаров." },
      { slug: "cis-delivery", title: "Доставка в СНГ", desc: "Масштабируйте продажи в Казахстан и Беларусь по упрощенной схеме." },
      { slug: "express-delivery", title: "Экспресс-доставка", desc: "Срочная отправка заказов день-в-день для ваших покупателей." },
      { slug: "returns-management", title: "Управление возвратами", desc: "Минимизируйте убытки. Быстрый возврат товара селлеру для повторной продажи." },
      { slug: "packaging-services", title: "Упаковка по стандартам", desc: "Профессиональная подготовка товаров к отгрузке на Ozon, WB и Яндекс Маркет." },
      { slug: "api-integration", title: "API Интеграция", desc: "Связь вашего магазина на CMS или самописном движке с базой СДЭК." },
      { slug: "cargo-insurance", title: "Страхование грузов", desc: "Полная материальная ответственность и защита ваших отправлений." },
      { slug: "logistics-analytics", title: "Аналитика логистики", desc: "Детальная статистика по географии, срокам и стоимости доставки." },
      { slug: "storage-services", title: "Ответхранение", desc: "Храните товары на профессиональных складах СДЭК с круглосуточной охраной." },
      { slug: "labeling-chestny-znak", title: "Маркировка «Честный ЗНАК»", desc: "Помощь в работе с обязательной маркировкой. Подготовка товаров по закону." },
      { slug: "courier-for-shops", title: "Курьерская доставка", desc: "Премиальный сервис для ваших покупателей. Доставка в руки в любом городе." },
      { slug: "pudo-delivery", title: "Доставка в ПВЗ", desc: "Самая широкая сеть в России. Клиенты заберут заказ там, где им удобно." },
      { slug: "last-mile", title: "Последняя миля", desc: "Безупречное завершение цепочки поставок. Гарантия сохранности на финальном этапе." },
      { slug: "magistral-delivery", title: "Магистраль", desc: "Перевозка больших объемов товаров между регионами фурами и авиацией." },
      { slug: "sorting-center", title: "Доставка в СЦ", desc: "Отгрузка на склады Wildberries, Ozon или Яндекс Маркета по расписанию." },
      { slug: "cash-on-delivery", title: "Наложенный платеж", desc: "Принимайте оплату при получении. Кассовое обслуживание и перевод денег." }
    ];

    function renderCards(filter = '') {
      const grid = document.getElementById('servicesGrid');
      grid.innerHTML = allServices
        .filter(s => s.title.toLowerCase().includes(filter.toLowerCase()) || s.desc.toLowerCase().includes(filter.toLowerCase()))
        .map(s => `
          <a href="/services/${s.slug}/" class="group flex flex-col h-full bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 hover:bg-slate-800/70 hover:border-cdek/50 transition-all duration-300 shadow-lg">
            <div class="h-12 w-12 bg-cdek/10 text-cdek rounded-xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-3 group-hover:text-cdek transition-colors">${s.title}</h3>
            <p class="text-slate-400 text-sm leading-relaxed flex-grow">${s.desc}</p>
            <div class="mt-6 flex items-center text-cdek text-xs font-semibold uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-opacity">
              Подробнее 
              <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </a>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => renderCards(e.target.value));
    renderCards();
  </script>
</body>
</html>
