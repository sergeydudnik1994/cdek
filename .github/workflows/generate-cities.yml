name: Generate SEO Cities

on:
  workflow_dispatch: # Эта команда создает кнопку ручного запуска

permissions:
  contents: write # Разрешаем скрипту сохранять папки в проект

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v3

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Запускаем генерацию 500 городов
        run: node generate-geo.js

      - name: Сохраняем новые города в GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Сгенерировано 500 SEO городов" || echo "Нет новых городов"
          git push

      - name: Авто-деплой на рабочий сервер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            git config --global --add safe.directory /var/www/cdek-html
            cd /var/www/cdek-html
            git fetch origin main
            git reset --hard origin/main
