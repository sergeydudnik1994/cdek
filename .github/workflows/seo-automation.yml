name: SEO Automation Workflow

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

concurrency:
  group: git-push-sync
  cancel-in-progress: false

jobs:
  seo-linter:
    name: 🛡️ Проверка SEO-ошибок
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Запуск Линтера
        run: python scripts/seo_linter.py

  generate-and-update:
    name: 🤖 Генерация Matrix SEO и Sitemap
    runs-on: ubuntu-latest
    needs: seo-linter
    permissions:
      contents: write

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Сборка матричных SEO-страниц
        run: python scripts/generate_matrix.py

      - name: Обновление sitemap.xml
        run: python scripts/update_sitemap.py
        
      - name: Сохранение обновленной карты сайта
        run: |
          git config --global user.name 'SEO-Bot'
          git config --global user.email 'bot@cdek-marketplace.ru'
          
          # 1. Принудительно очищаем состояние от старых конфликтов
          git checkout sitemap.xml || true
          
          # 2. Добавляем индекс, все части карты сайта и текстовый список URL
          git add sitemap.xml sitemap_main.xml sitemap_geo_*.xml all_urls.txt
          
          # 3. Фиксируем и отправляем
          if git status --porcelain | grep -q .; then
            git commit -m "Auto-update Sitemap Index and parts [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master
            git push origin HEAD
          else
            echo "Изменений в карте сайта нет."
          fi

      - name: Пинг поисковиков (Bing и Яндекс)
        if: github.event_name == 'schedule'
        run: |
          curl -s "http://www.bing.com/ping?sitemap=https://cdek-marketplace.ru/sitemap.xml"
          curl -s "https://webmaster.yandex.ru/ping?sitemap=https://cdek-marketplace.ru/sitemap.xml"
