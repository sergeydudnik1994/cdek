name: SEO Automation Workflow

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

concurrency:
  group: seo-sync
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    name: 🤖 SEO Matrix & Auto-Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1. Генерация страниц, карт и фидов
        run: |
          python scripts/generate_matrix.py
          python scripts/generate_global_services.py
          python generate_geo_pages.py
          python scripts/update_sitemap.py
          python scripts/generate_yandex_feed.py

      - name: 2. Сохранение в GitHub
        run: |
          git config --global user.name 'SEO-Bot'
          git config --global user.email 'bot@cdek-marketplace.ru'
          
          git add sitemap.xml sitemap_main.xml sitemap_geo_*.xml all_urls.txt feed.yml
          
          if ! git diff --cached --quiet; then
            git commit -m "Update SEO Matrix, Sitemap and Yandex Feed [skip ci]"
            git push origin HEAD --force
          else
            echo "Изменений для коммита нет."
          fi

      - name: 3. Мгновенный деплой на сервер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /var/www/cdek-html
            git fetch origin main
            git reset --hard origin/main
            python3 generate_geo_pages.py
            echo "✅ Сайт, карта сайта и фиды успешно обновлены!"
