name: SEO Automation Workflow

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

concurrency:
  group: git-push-sync
  cancel-in-progress: false

jobs:
  seo-linter:
    name: 🛡️ Проверка SEO-ошибок
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v3
      
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Запуск Линтера
        run: python scripts/seo_linter.py

  generate-and-update:
    name: 🤖 Генерация Matrix SEO и Sitemap
    runs-on: ubuntu-latest
    needs: seo-linter
    permissions:
      contents: write
    
    steps:
      - name: Checkout кода
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Сборка матричных SEO-страниц
        run: python scripts/generate_matrix.py

      - name: Сборка глобальных страниц услуг
        run: python scripts/generate_global_services.py

      - name: Обновление sitemap.xml
        run: python scripts/update_sitemap.py
        
      - name: Сохранение сгенерированных страниц в репозиторий
        run: |
          git config --global user.name 'SEO-Bot'
          git config --global user.email 'bot@cdek-marketplace.ru'
          
          # Добавляем все сгенерированные файлы и карту сайта
          git add -A
          
          # Проверяем, есть ли изменения для коммита
          if git status --porcelain | grep -q .; then
            git commit -m "Auto-generate Matrix SEO pages and update sitemap"
            git pull --rebase origin main || git pull --rebase origin master
            git push origin HEAD
          else
            echo "Нет изменений для сохранения."
          fi

      - name: Пинг поисковиков (Bing и Яндекс)
        if: github.event_name == 'schedule'
        run: |
          curl -s "http://www.bing.com/ping?sitemap=https://cdek-marketplace.ru/sitemap.xml"
          echo "Пинг в Bing отправлен"
          curl -s "https://webmaster.yandex.ru/ping?sitemap=https://cdek-marketplace.ru/sitemap.xml"
          echo "Пинг в Яндекс отправлен"
