name: SEO Automation Workflow

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

concurrency:
  group: git-push-sync
  cancel-in-progress: false

jobs:
  seo-linter:
    name: 🛡️ Проверка SEO-ошибок
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v3

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Запуск Линтера
        run: python scripts/seo_linter.py

  generate-and-update:
    name: 🤖 Генерация Matrix SEO и Sitemap
    runs-on: ubuntu-latest
    needs: seo-linter
    permissions:
      contents: write

    steps:
      - name: Checkout кода
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Сборка матричных SEO-страниц
        run: python scripts/generate_matrix.py

      - name: Обновление sitemap.xml
        run: python scripts/update_sitemap.py
        
      - name: Сохранение изменений в репозиторий
        run: |
          git config --global user.name 'SEO-Bot'
          git config --global user.email 'bot@cdek-marketplace.ru'
          
          # Добавляем карту сайта и папку geo, чтобы теги {{SEO_TITLE}} заменились на сайте
          git add sitemap.xml geo/
          
          # Проверяем наличие изменений перед коммитом
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update SEO tags and sitemap"
            git pull --rebase origin main || git pull --rebase origin master
            git push origin HEAD
          else
            echo "Изменений для сохранения не обнаружено."
          fi

      - name: Пинг поисковиков (Bing и Яндекс)
        if: github.event_name == 'schedule'
        run: |
          curl -s "http://www.bing.com/ping?sitemap=https://cdek-marketplace.ru/sitemap.xml"
          curl -s "https://webmaster.yandex.ru/ping?sitemap=https://cdek-marketplace.ru/sitemap.xml"
