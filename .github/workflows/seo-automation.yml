name: SEO Automation Workflow

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

concurrency:
  group: seo-sync
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    name: 🤖 SEO Matrix & Auto-Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1. Генерация страниц и карт
        run: |
          python scripts/generate_matrix.py
          python scripts/generate_global_services.py
          python scripts/generate_industries.py
          python scripts/generate_industry_geo.py
          python scripts/generate_integrations.py
          python scripts/update_sitemap.py

      - name: 2. Сохранение в GitHub
        run: |
          git config --global user.name 'SEO-Bot'
          git config --global user.email 'bot@cdek-marketplace.ru'
          
          # Добавляем карты сайта и все директории, включая integrations/
          git add sitemap*.xml all_urls.txt geo/ solutions/ services/ blog/ integrations/
          
          # Проверяем наличие изменений перед коммитом
          if ! git diff --cached --quiet; then
            git commit -m "Update SEO Matrix, Solutions, Integrations and Sitemap [skip ci]"
            git push origin HEAD --force
          else
            echo "Изменений для коммита нет."
          fi

      - name: 3. Мгновенный деплой на сервер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
              git config --global --add safe.directory /var/www/cdek
              cd /var/www/cdek
              git fetch origin main
              git reset --hard origin/main
              sudo systemctl reload nginx || true
