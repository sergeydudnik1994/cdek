name: Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            git config --global --add safe.directory /var/www/cdek-html
            cd /var/www/cdek-html
            git fetch origin main
            git reset --hard origin/main
# Вот эта строчка автоматически вычистит битый include на всех страницах:
            find . -type f -name "*.html" -exec sed -i '/<!--#include virtual="\/src\/components\/mobile-cta\.html" -->/d' {} +
            systemctl reload nginx
