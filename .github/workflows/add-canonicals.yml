name: Авто-добавление Canonical

on:
  workflow_dispatch:

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запускаем скрипт canonical
        run: node add-canonicals.js

      - name: Сохраняем изменения
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Автоматически добавлены теги canonical"
          git push
