name: SEO Fix & IndexNow Submit

on:
  workflow_dispatch: # Позволяет запускать процесс кнопкой вручную

jobs:
  run-seo-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем права на сохранение исправленного кода обратно в репозиторий

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Запуск скрипта лечения и отправки в Яндекс
        run: python scripts/seo_fix_and_submit.py

      - name: Сохранение исправленных файлов блога
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          # Сохраняем только если были изменения, иначе идем дальше
          git commit -m "Auto-fix canonical tags in blog" || echo "No changes to commit"
          git push
