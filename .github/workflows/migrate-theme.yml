name: Pure Responsive Adaptation

on:
  workflow_dispatch:

jobs:
  adapt-responsive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Clean Mobile Adaptation
        run: |
          python3 - << 'EOF'
          import os
          import re

          EXCLUDE_DIRS = {'.git', 'node_modules', '.github', '.astro'}

          def clean_adapt(content):
              # 1. Удаляем любые следы mobile-cta.html, если они случайно просочились
              content = re.sub(r'\s*<!--#include virtual="/src/components/mobile-cta\.html"\s*-->', '', content)

              # 2. Обеспечиваем чистый body без лишних паддингов снизу и с защитой от вылета по ширине
              if '<body' in content:
                  content = re.sub(r'<body class="([^"]*)"', lambda m: '<body class="' + ' '.join(set((m.group(1) + ' overflow-x-hidden break-words').split())) + '"', content)
                  # Убираем ненужные мобильные отступы под плашку (pb-16, pb-20)
                  content = content.replace('pb-16 md:pb-0', '').replace('pb-20 md:pb-0', '')

              # 3. Адаптируем крупные шрифты и отступы под экраны 375-430px
              content = content.replace('text-3xl sm:text-5xl lg:text-[3.5rem]', 'text-2xl sm:text-4xl lg:text-5xl')
              content = content.replace('text-4xl sm:text-5xl', 'text-2xl sm:text-4xl')
              content = content.replace('p-8 sm:p-10', 'p-5 sm:p-8')
              content = content.replace('py-16 sm:py-20', 'py-10 sm:py-16')

              # 4. Проверяем сетки: переводим жесткие grid-cols-2 в адаптивные grid-cols-1 sm:grid-cols-2
              content = content.replace('grid grid-cols-2 gap-4', 'grid grid-cols-1 sm:grid-cols-2 gap-4')
              content = content.replace('grid grid-cols-2 gap-6', 'grid grid-cols-1 sm:grid-cols-2 gap-6')

              return content

          updated_count = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS]
              for file in files:
                  if file.endswith('.html'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          txt = f.read()
                      new_txt = clean_adapt(txt)
                      if new_txt != txt:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_txt)
                          updated_count += 1
                          print(f"Clean Adapted: {path}")

          print(f"Total pages updated: {updated_count}")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Responsive: Чистая мобильная адаптация сеток и отступов без плавающих плашек"
            git pull --rebase origin main
            git push origin main
          fi
