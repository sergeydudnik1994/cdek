name: IndexNow Auto Submit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed HTML files and ping IndexNow
        run: |
          HOST="cdek-marketplace.ru"
          KEY="Aa1234567"

          # Находим добавленные или измененные .html файлы в текущем коммите
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep '\.html$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "Нет измененных HTML файлов в этом коммите. Пропускаем отправку."
            exit 0
          fi

          echo "Найдены измененные страницы:"
          echo "$CHANGED_FILES"

          URL_LIST=()
          for file in $CHANGED_FILES; do
            if [ "$file" = "index.html" ]; then
              URL_LIST+=("\"https://$HOST/\"")
            else
              CLEAN_FILE=$(echo "$file" | sed 's/\/index\.html$/\//')
              URL_LIST+=("\"https://$HOST/$CLEAN_FILE\"")
            fi
          done

          JSON_URLS=$(IFS=,; echo "${URL_LIST[*]}")

          PAYLOAD=$(cat <<EOF
          {
            "host": "$HOST",
            "key": "$KEY",
            "keyLocation": "https://$HOST/$KEY.txt",
            "urlList": [$JSON_URLS]
          }
          EOF
          )

          echo "Отправляем payload в IndexNow:"
          echo "$PAYLOAD"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")

          echo "Ответ от API IndexNow: HTTP $RESPONSE"

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "Успешно отправлено!"
          else
            echo "Ошибка отправки (код $RESPONSE)"
            exit 1
          fi
