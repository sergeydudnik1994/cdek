name: Update SEO, Open Graph & Schema.org

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-marketplace-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inject Rich Snippets and Meta Tags
        shell: python
        run: |
          import os
          import re
          import json

          BASE_DIR = "."
          BASE_URL = "https://cdek-marketplace.ru"
          PHONE = "+7-993-322-15-20"
          EMAIL = "sv.dudik@cdek.ru"
          TELEGRAM = "https://t.me/cdek_marketplace"
          WHATSAPP = "https://wa.me/79933221520"
          MAX_APP = "https://max.ru/u/f9LHodD0cOIzaS1qORDXcJzrkKFof3ACzehNo6cFxOcrfwa6KtVgohy-Pxo"
          DEFAULT_IMAGE = f"{BASE_URL}/og-image.png"

          updated_count = 0

          for root, dirs, files in os.walk(BASE_DIR):
              if any(skip in root for skip in [".git", ".github", "components", "src/components", "scripts", "node_modules"]):
                  continue
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      # 1. Извлечение Title и Description
                      title_m = re.search(r"<title>(.*?)</title>", content, re.IGNORECASE | re.DOTALL)
                      title = title_m.group(1).strip() if title_m else "СДЭК Маркетплейсы"

                      desc_m = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', content, re.IGNORECASE)
                      desc = desc_m.group(1).strip() if desc_m else title

                      # 2. Формирование URL
                      rel_path = os.path.relpath(filepath, BASE_DIR).replace("\\", "/")
                      if rel_path == "index.html":
                          page_url = f"{BASE_URL}/"
                          page_name = "Главная"
                      else:
                          clean_path = rel_path.replace("index.html", "").strip("/")
                          page_url = f"{BASE_URL}/{clean_path}/" if clean_path else f"{BASE_URL}/"
                          page_name = title.split("|")[0].split("—")[0].split(":")[0].strip()

                      # 3. Навигационная цепочка (Breadcrumbs)
                      breadcrumbs = [
                          {"@type": "ListItem", "position": 1, "name": "Главная", "item": f"{BASE_URL}/"}
                      ]
                      if "/" in clean_path if rel_path != "index.html" else False:
                          parts = [p for p in clean_path.split("/") if p]
                          if len(parts) > 1:
                              parent_slug = parts[0]
                              parent_name = parent_slug.replace("-", " ").capitalize()
                              breadcrumbs.append({"@type": "ListItem", "position": 2, "name": parent_name, "item": f"{BASE_URL}/{parent_slug}/"})
                              breadcrumbs.append({"@type": "ListItem", "position": 3, "name": page_name, "item": page_url})
                          else:
                              breadcrumbs.append({"@type": "ListItem", "position": 2, "name": page_name, "item": page_url})
                      elif page_url != f"{BASE_URL}/":
                          breadcrumbs.append({"@type": "ListItem", "position": 2, "name": page_name, "item": page_url})

                      # 4. Schema.org граф
                      schema_graph = {
                          "@context": "https://schema.org",
                          "@graph": [
                              {
                                  "@type": "WebSite",
                                  "@id": f"{BASE_URL}/#website",
                                  "url": f"{BASE_URL}/",
                                  "name": "СДЭК Маркетплейсы",
                                  "inLanguage": "ru-RU",
                                  "potentialAction": {
                                      "@type": "SearchAction",
                                      "target": f"{BASE_URL}/tracking/?cdek_number={{search_term_string}}",
                                      "query-input": "required name=search_term_string"
                                  }
                              },
                              {
                                  "@type": "Organization",
                                  "@id": f"{BASE_URL}/#organization",
                                  "name": "СДЭК для Маркетплейсов",
                                  "url": f"{BASE_URL}/",
                                  "logo": f"{BASE_URL}/favicon.png",
                                  "email": EMAIL,
                                  "telephone": PHONE,
                                  "sameAs": [TELEGRAM, WHATSAPP, MAX_APP],
                                  "contactPoint": [
                                      {
                                          "@type": "ContactPoint",
                                          "telephone": PHONE,
                                          "contactType": "sales",
                                          "areaServed": "RU",
                                          "availableLanguage": ["Russian"],
                                          "contactOption": "TollFree"
                                      },
                                      {
                                          "@type": "ContactPoint",
                                          "url": TELEGRAM,
                                          "contactType": "customer support",
                                          "availableLanguage": ["Russian"]
                                      },
                                      {
                                          "@type": "ContactPoint",
                                          "url": MAX_APP,
                                          "contactType": "customer support",
                                          "availableLanguage": ["Russian"]
                                      }
                                  ],
                                  "potentialAction": [
                                      {
                                          "@type": "CommunicateAction",
                                          "name": "Написать в Telegram",
                                          "target": TELEGRAM
                                      },
                                      {
                                          "@type": "CommunicateAction",
                                          "name": "Написать в WhatsApp",
                                          "target": WHATSAPP
                                      },
                                      {
                                          "@type": "CommunicateAction",
                                          "name": "Написать в MAX",
                                          "target": MAX_APP
                                      },
                                      {
                                          "@type": "OrderAction",
                                          "name": "Подключить доставку на маркетплейсы",
                                          "target": f"{page_url}#leadForm"
                                      }
                                  ]
                              },
                              {
                                  "@type": "BreadcrumbList",
                                  "@id": f"{page_url}#breadcrumb",
                                  "itemListElement": breadcrumbs
                              },
                              {
                                  "@type": "Service",
                                  "@id": f"{page_url}#service",
                                  "name": title,
                                  "provider": {"@id": f"{BASE_URL}/#organization"},
                                  "areaServed": {"@type": "Country", "name": "Россия"},
                                  "description": desc,
                                  "offers": {
                                      "@type": "Offer",
                                      "price": "0",
                                      "priceCurrency": "RUB",
                                      "availability": "https://schema.org/InStock",
                                      "url": page_url
                                  }
                              }
                          ]
                      }

                      schema_json_str = json.dumps(schema_graph, ensure_ascii=False, indent=2)
                      schema_block = f'<script type="application/ld+json">\n{schema_json_str}\n</script>'

                      # 5. Open Graph & Social Cards
                      og_block = (
                          '<!-- Open Graph & Social Cards -->\n'
                          '  <meta property="og:type" content="website" />\n'
                          '  <meta property="og:site_name" content="СДЭК Маркетплейсы" />\n'
                          '  <meta property="og:locale" content="ru_RU" />\n'
                          f'  <meta property="og:title" content="{title}" />\n'
                          f'  <meta property="og:description" content="{desc}" />\n'
                          f'  <meta property="og:url" content="{page_url}" />\n'
                          f'  <meta property="og:image" content="{DEFAULT_IMAGE}" />\n'
                          '  <meta property="og:image:width" content="1200" />\n'
                          '  <meta property="og:image:height" content="630" />\n'
                          '  <meta property="og:image:type" content="image/png" />\n'
                          '  <meta name="twitter:card" content="summary_large_image" />\n'
                          f'  <meta name="twitter:title" content="{title}" />\n'
                          f'  <meta name="twitter:description" content="{desc}" />\n'
                          f'  <meta name="twitter:image" content="{DEFAULT_IMAGE}" />'
                      )

                      # Очистка старых тегов
                      content = re.sub(r'<!--\s*(?:Open Graph|Twitter).*?-->', '', content, flags=re.DOTALL)
                      content = re.sub(r'\n\s*<meta\s+property=["\']og:[^>]*>', '', content)
                      content = re.sub(r'\n\s*<meta\s+name=["\']twitter:[^>]*>', '', content)
                      content = re.sub(r'<script\s+type=["\']application/ld\+json["\']>.*?</script>', '', content, flags=re.DOTALL)

                      if "</head>" in content:
                          combined_block = f"  {og_block}\n\n  {schema_block}\n</head>"
                          content = content.replace("</head>", combined_block)
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(content)
                          updated_count += 1
                          print(f"Обновлен: {filepath}")

          print(f"Всего файлов обновлено: {updated_count}")

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "feat(seo): update Open Graph (og-image) and rich schema on all pages [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Изменений нет, все теги актуальны."
          fi
