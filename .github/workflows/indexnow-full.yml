name: IndexNow FULL Submit

on:
  workflow_dispatch: # Запуск только вручную по кнопке!

jobs:
  submit-all-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse Sitemap and Submit to IndexNow
        run: |
          echo "🚀 Запуск профессионального скрипта индексации..."
          # Мы просто запускаем наш отлаженный JS-файл, 
          # который умеет бить 71 000 ссылок на безопасные пачки.
          node scripts/indexnow-submit.js
