name: Авто-добавление хлебных крошек

# Запускаем вручную по кнопке
on:
  workflow_dispatch:

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем боту права на сохранение файлов

    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запускаем скрипт
        run: node add-breadcrumbs.js

      - name: Сохраняем изменения в GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Автоматически добавлена микроразметка JSON-LD"
          git push
