name: Fix Typography and City Layout

on:
  workflow_dispatch:

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean up and Re-render Hero Section in All Geo Pages
        run: |
          python - << 'EOF'
          import os
          import re

          fixed_count = 0

          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and 'geo' in root:
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()

                          # 1. Извлекаем ЧИСТЫЙ город в предложном падеже из og:title или schema
                          city_prep = "в вашем городе"
                          og_match = re.search(r'property=["\']og:title["\']\s+content=["\'](?:СДЭК для селлеров\s+)?(?:в|во)\s+([^:|–—<]+)', content, re.IGNORECASE)
                          if og_match:
                              clean_city = og_match.group(1).strip()
                              city_prep = f"в {clean_city}"

                          # 2. Извлекаем именительный падеж для крошек
                          city_nom = clean_city if og_match else "Город"
                          nav_match = re.search(r'<nav.*?>.*?<span class="text-white[^>]*>([^<]+)</span>', content, re.DOTALL)
                          if nav_match and "для" not in nav_match.group(1):
                              city_nom = nav_match.group(1).strip()

                          # 3. Извлекаем количество ПВЗ
                          pvz_count = "5+"
                          pvz_match = re.search(r'([0-9]+)\+?\s*ПВЗ', content)
                          if pvz_match:
                              pvz_count = pvz_match.group(1).strip()

                          # 4. Формируем идеальный 2-колоночный Hero с чистой типографикой
                          hero_html = f"""  <!--#include virtual="/src/components/header.html" -->
            <main class="flex-grow pb-16">
              <!-- HERO СЕКЦИЯ С ФОРМОЙ ЗАЯВКИ -->
              <section class="bg-[#060B11] text-white pt-6 pb-12 sm:pt-8 sm:pb-16 overflow-hidden relative border-b border-white/[0.08]">
                <div class="absolute -top-24 -left-24 w-72 sm:w-96 h-72 sm:h-96 bg-[#22E58B]/15 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute top-1/2 -right-24 w-80 sm:w-[450px] h-80 sm:h-[450px] bg-[#00b341]/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                  <nav class="text-xs sm:text-sm text-slate-400 mb-6 sm:mb-8">
                    <a href="/" class="hover:text-[#22E58B] transition-colors">Главная</a> <span class="mx-2 text-slate-600">/</span>
                    <a href="/geo/" class="hover:text-[#22E58B] transition-colors">Логистика</a> <span class="mx-2 text-slate-600">/</span>
                    <span class="text-white font-medium">{city_nom}</span>
                  </nav>

                  <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-center">
                    <!-- Левая колонка: Оффер и УТП -->
                    <div class="lg:col-span-7 space-y-6 sm:space-y-8">
                      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/[0.04] border border-[#22E58B]/30 text-xs font-bold text-[#22E58B] uppercase tracking-wider mb-2">
                        <span class="w-2 h-2 rounded-full bg-[#22E58B] animate-pulse"></span>
                        Официальное B2B-подключение
                      </div>
                      
                      <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight leading-[1.15]">
                        Заключение договора СДЭК <br>
                        <span class="bg-gradient-to-r from-[#22E58B] via-[#00b341] to-[#00E5FF] bg-clip-text text-transparent">{city_prep} со скидкой до 50%</span>
                      </h1>

                      <p class="text-slate-300 text-base sm:text-lg max-w-xl leading-relaxed font-normal">
                        Официальный B2B-договор со СДЭК {city_prep} для интернет-магазинов, юридических лиц, ИП и селлеров маркетплейсов. Доставка FBS, FBO и DBS со скидкой до 50%.
                      </p>

                      <div class="flex flex-wrap gap-2.5 pt-1">
                        <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-200">
                          <span class="text-[#22E58B]">✓</span> {pvz_count}+ ПВЗ {city_prep}
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-200">
                          <span class="text-[#22E58B]">✓</span> Отгрузки FBS, FBO и DBS
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-200">
                          <span class="text-[#22E58B]">✓</span> Готовые модули и API 2.0
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-slate-200">
                          <span class="text-[#22E58B]">✓</span> Наложенный платеж 54-ФЗ
                        </span>
                      </div>

                      <div class="grid grid-cols-3 gap-4 pt-4 border-t border-white/10 max-w-lg">
                        <div>
                          <div class="text-2xl sm:text-3xl font-black text-[#22E58B]">0 ₽</div>
                          <div class="text-xs text-slate-400 mt-0.5">Договор</div>
                        </div>
                        <div>
                          <div class="text-2xl sm:text-3xl font-black text-white">15 мин</div>
                          <div class="text-xs text-slate-400 mt-0.5">Оформление</div>
                        </div>
                        <div>
                          <div class="text-2xl sm:text-3xl font-black bg-gradient-to-r from-[#22E58B] to-[#00E5FF] bg-clip-text text-transparent">до 50%</div>
                          <div class="text-xs text-slate-400 mt-0.5">Экономия</div>
                        </div>
                      </div>
                    </div>

                    <!-- Правая колонка: Форма заявки (leadform.html) -->
                    <div class="lg:col-span-5" id="leadForm">
                      <!--#include virtual="/src/components/leadform.html" -->
                    </div>
                  </div>
                </div>
              </section>

              <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12">"""

                          # 5. Чистая замена шапки до блока списка услуг
                          content = re.sub(
                              r'<!--#include virtual="/src/components/header\.html"\s*-->.*?<section class="mb-16">',
                              f'{hero_html}\n        <section class="mb-16">',
                              content,
                              flags=re.DOTALL
                          )

                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(content)
                          fixed_count += 1
                      except Exception as e:
                          print(f"Ошибка в файле {file_path}: {e}")

          print(f"Успешно выровнена верстка в файлах: {fixed_count}")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "UI: идеальное выравнивание H1 и текста во всех 500 городах" || exit 0
          git push origin main
