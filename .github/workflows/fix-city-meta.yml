name: Fix City Pages Layout

on:
  workflow_dispatch:

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair HTML and CSS in all geo pages
        run: |
          python - << 'EOF'
          import os
          import re

          fixed_count = 0

          # Правильный блок Tailwind config
          clean_tailwind_config = """  <script src="https://cdn.tailwindcss.com"></script>
            <script>
              tailwind.config = {
                theme: {
                  extend: {
                    colors: {
                      cdek: '#00b341',
                      neon: '#22E58B',
                      obsidian: '#060B11',
                      card: '#0B131D'
                    }
                  }
                }
              };
            </script>"""

          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and 'geo' in root:
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()

                          # 1. Исправляем сломанный tailwind.config в head
                          content = re.sub(
                              r'<script src="https://cdn\.tailwindcss\.com"></script>\s*<script>.*?</script>',
                              clean_tailwind_config,
                              content,
                              flags=re.DOTALL
                          )

                          # 2. Исправляем h1: возвращаем правильные классы шрифта и отступов
                          content = re.sub(
                              r'<h1[^>]*>(.*?)</h1>',
                              r'<h1 class="text-2xl sm:text-4xl font-black text-white tracking-tight mb-4">\1</h1>',
                              content,
                              flags=re.DOTALL
                          )

                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(content)
                          fixed_count += 1
                      except Exception as e:
                          print(f"Ошибка в файле {file_path}: {e}")

          print(f"Успешно восстановлено файлов городов: {fixed_count}")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix: восстановление шрифтов, Tailwind и стилей H1 во всех городах" || exit 0
          git push origin main
