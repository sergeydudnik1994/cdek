name: Auto-Generate Blog Articles

on:
  schedule:
    - cron: '0 6 * * *' # Автоматический запуск каждый день в 06:00 UTC (09:00 по МСК)
  workflow_dispatch: # Позволяет запускать скрипт вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Article Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_article.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "CDEK Blog Bot"
          git config --global user.email "bot@cdek-marketplace.ru"
          git add .
          git commit -m "Auto-publish: new SEO article" || exit 0
          git push
