name: Generate Geo Pages

on:
  workflow_dispatch: # Кнопка для ручного запуска в интерфейсе GitHub
  push:
    paths:
      - 'generate_geo_pages.py'
      - 'geo/index.html'

permissions:
  contents: write

jobs:
  generate-geo:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Запуск генератора страниц городов
        run: |
          python generate_geo_pages.py

      - name: Сохранение и отправка изменений в Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add geo/
          git diff --staged --quiet || (git commit -m "Auto-generate geo pages [skip ci]" && git push)
