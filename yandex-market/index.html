            {

            "@type": "Question",

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cdek: '#8de21a', yamarket: '#ff5722', dark: { 900: '#0b101d' } } } }

  <script src="https://cdn.jsdelivr.net/npm/@cdek-it/widget@3" async></script>

<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-[#ff5722] selection:text-white pb-16 md:pb-0">

  <!-- Nginx: Подключение шапки -->
  <!--#include virtual="/src/components/header.html" -->

  <main class="flex-grow">
    
    <!-- HERO СЕКЦИЯ С ФОРМОЙ СПРАВА -->
    <section class="pt-12 sm:pt-20 pb-12 relative overflow-hidden">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="grid lg:grid-cols-12 gap-12 items-start">
          
          <!-- Левая колонка: Текст -->
          <div class="lg:col-span-7 space-y-8">
            <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-[#fc3f1d]/15 border border-[#fc3f1d]/30 backdrop-blur-sm">
              <div class="w-2.5 h-2.5 rounded-full bg-[#fc3f1d] shadow-[0_0_10px_#fc3f1d] animate-pulse"></div>
              <span class="text-xs font-bold text-[#ff5722] uppercase tracking-wider">Яндекс Маркет DBS / FBS</span>
            </div>
            
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-white tracking-tight leading-[1.1]">
              Доставка СДЭК <br class="hidden sm:block" />
              для селлеров <span class="text-[#ff5722] drop-shadow-[0_0_20px_rgba(255,87,34,0.4)]">Яндекс Маркета</span>
            </h1>
            
            <p class="text-slate-300 text-lg sm:text-xl leading-relaxed max-w-2xl">
              Надежная доставка заказов покупателям по моделям <b class="text-white">DBS и FBS</b> с интеграцией всех статусов и быстрой отгрузкой.
            </p>

            <div class="grid grid-cols-2 gap-6 pt-6 border-t border-slate-800/80 max-w-2xl">
              <div>
                <div class="text-2xl sm:text-3xl font-bold text-[#ff5722] mb-1">Интеграция 0 ₽</div>
                <div class="text-sm text-slate-400">Помощь в настройке</div>
              </div>
              <div>
                <div class="text-2xl sm:text-3xl font-bold text-white mb-1">Постоплата</div>
                <div class="text-sm text-slate-400">Удобные расчеты</div>
              </div>
            </div>
          </div>

          <!-- Правая колонка: Форма заявки -->
          <div class="lg:col-span-5" id="mainLeadForm">
            <div class="sticky top-28">
              <!--#include virtual="/src/components/leadform.html" -->
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- КАЛЬКУЛЯТОР -->

      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <!--#include virtual="/src/components/calculator-widget.html" -->

    </section>

    <!-- Блог (новости логистики) -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <!--#include virtual="/src/components/blog-latest.html" -->

  </main>

  <!-- Nginx: Подключение подвала -->
  <!--#include virtual="/src/components/footer.html" -->
  <!--#include virtual="/src/components/mobile-cta.html" -->

  <!-- Скрипт прокрутки до формы -->
  <script>
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('.scroll-to-form');
      if (btn) {
        e.preventDefault();
        const formElement = document.getElementById('mainLeadForm');
        if (formElement) {
          formElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const firstInput = formElement.querySelector('input');
          if (firstInput) setTimeout(() => firstInput.focus(), 400);
        }
      }
    });
  </script>

</body>
</html>
