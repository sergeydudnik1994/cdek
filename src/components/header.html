<header class="sticky top-0 z-50 bg-[#0b101d]/95 backdrop-blur-md border-b border-slate-800 shadow-sm shadow-[#0b101d]/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Левая часть: Логотип, Выбор города -->
    <div class="flex items-center gap-4 sm:gap-6">
      <a href="/" class="flex items-center gap-2 group transition-transform hover:scale-105">
        <span class="text-xl sm:text-2xl font-black text-white tracking-tight">СДЭК <span class="text-cdek">Маркетплейсы</span></span>
      </a>

      <!-- Кнопка выбора города -->
      <button id="openCityModal" type="button" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/60 text-xs font-medium text-slate-200 hover:border-cdek/50 hover:text-white transition-all cursor-pointer">
        <svg class="w-3.5 h-3.5 text-cdek shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span class="tracking-wide">Выберите город</span>
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </button>
    </div>

    <!-- Правая часть: Навигация -->
    <div class="flex items-center gap-6">
      <nav class="hidden md:flex items-center gap-6">
        <a href="/calculator/" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Калькулятор</a>
        <a href="/#platforms" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Маркетплейсы</a>
        <a href="/blog/" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Блог</a>
      </nav>

      <a href="/#leadForm" class="hidden sm:inline-flex items-center justify-center px-5 py-2 text-sm font-extrabold text-[#0b101d] bg-cdek rounded-lg hover:bg-cdek/90 transition-all shadow-lg shadow-cdek/20">
        Подключиться
      </a>

      <!-- Кнопка мобильного меню (бургер) -->
      <button id="menuToggle" type="button" class="md:hidden flex items-center justify-center p-2 rounded-md border border-slate-700 text-slate-300 hover:text-cdek hover:border-cdek focus:outline-none transition-colors cursor-pointer" aria-label="Открыть меню">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Выпадающее мобильное меню -->
  <div id="mobileMenu" class="hidden md:hidden bg-[#0b101d]/95 backdrop-blur-lg border-b border-slate-800 px-6 pt-4 pb-6 shadow-xl">
    <div class="mb-4 pb-4 border-b border-slate-800/60">
      <button id="openCityModalMobile" type="button" class="w-full flex items-center justify-between py-2.5 px-4 rounded-lg bg-slate-800/50 border border-slate-700/60 text-sm font-medium text-slate-200">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-cdek" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
          <span>Ваш город</span>
        </span>
        <span class="text-xs text-cdek font-bold bg-slate-900/50 px-2 py-1 rounded-md">Выбрать</span>
      </button>
    </div>

    <nav class="space-y-2 mb-6">
      <a href="/calculator/" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">Калькулятор тарифов</a>
      <a href="/#platforms" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">Схемы работы (FBS/DBS)</a>
      <a href="/blog/" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">Блог селлера</a>
    </nav>
    
    <div>
      <a href="/#leadForm" class="flex items-center justify-center w-full py-3.5 bg-cdek hover:bg-cdek/90 text-[#0b101d] font-extrabold text-sm rounded-xl transition-all shadow-lg shadow-cdek/20">
        Заключить договор
      </a>
    </div>
  </div>
</header>

<!-- Модальное окно выбора города -->
<div id="cityModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">
  <div class="bg-[#131b2c] border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <h3 class="text-lg font-bold text-white">Выберите ваш город</h3>
      <button id="closeCityModal" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="p-4 border-b border-slate-800 bg-[#0b101d]/50 relative">
      <svg class="w-5 h-5 absolute left-7 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      <input type="text" id="citySearchInput" placeholder="Введите название города..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cdek transition-colors text-sm">
    </div>

    <div class="p-6 overflow-y-auto space-y-6 custom-scrollbar">
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Популярные города</div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          <a href="/geo/moskva/" class="city-item p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Москва</a>
          <a href="/geo/sankt-peterburg/" class="city-item p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Санкт-Петербург</a>
          <a href="/geo/krasnodar/" class="city-item p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Краснодар</a>
          <a href="/geo/kazan/" class="city-item p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Казань</a>
          <a href="/geo/ekaterinburg/" class="city-item p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Екатеринбург</a>
          <a href="/geo/rostov-na-donu/" class="city-item p-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Ростов-на-Дону</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');

  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  }

  const cityModal = document.getElementById('cityModal');
  const openCityModalBtn = document.getElementById('openCityModal');
  const openCityModalMobileBtn = document.getElementById('openCityModalMobile');
  const closeCityModalBtn = document.getElementById('closeCityModal');
  const citySearchInput = document.getElementById('citySearchInput');

  function toggleModal(show) {
    if (cityModal) {
      if (show) {
        cityModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        setTimeout(() => citySearchInput?.focus(), 100);
      } else {
        cityModal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }
  }

  openCityModalBtn?.addEventListener('click', () => toggleModal(true));
  openCityModalMobileBtn?.addEventListener('click', () => {
    mobileMenu.classList.add('hidden');
    toggleModal(true);
  });
  closeCityModalBtn?.addEventListener('click', () => toggleModal(false));
  
  cityModal?.addEventListener('click', (e) => {
    if (e.target === cityModal) toggleModal(false);
  });

  citySearchInput?.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    const items = document.querySelectorAll('.city-item');
    
    items.forEach(item => {
      const text = item.textContent.toLowerCase();
      if (text.includes(val)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  });
</script>
