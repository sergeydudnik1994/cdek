      <button id="closeCityModal" class="text-slate-400 hover:text-white transition-colors p-1 cursor-pointer">

    </div>

        <input type="text" id="citySearchInput" placeholder="Введите название города..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-white text-sm focus:outline-none focus:border-cdek transition-all placeholder-slate-500" />

          <a href="/geo/saint-petersburg/" class="city-item p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Санкт-Петербург</a>
          <a href="/geo/krasnodar/" class="city-item p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Краснодар</a>
          <a href="/geo/kazan/" class="city-item p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Казань</a>
          <a href="/geo/yekaterinburg/" class="city-item p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Екатеринбург</a>
          <a href="/geo/rostov-na-donu/" class="city-item p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-200 hover:text-white transition-all text-center font-medium">Ростов-на-Дону</a>
        </div>

      <!-- Все города (Для GitHub Actions) -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Все города</div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
          <!-- Сюда скрипт вставит 500 городов -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Логика мобильного меню
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  const mobileMenuIcon = document.getElementById('mobileMenuIcon');

  mobileMenuBtn?.addEventListener('click', () => {
    const isHidden = mobileMenu.classList.contains('hidden');
    if (isHidden) {
      mobileMenu.classList.remove('hidden');
      mobileMenu.classList.add('flex');
      document.body.style.overflow = 'hidden';
      mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />';
    } else {
      mobileMenu.classList.add('hidden');
      mobileMenu.classList.remove('flex');
      document.body.style.overflow = '';
      mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />';
    }
  });

  // Закрытие при клике по ссылкам
  const mobileLinks = mobileMenu.querySelectorAll('a');
  mobileLinks.forEach(link => {
    link.addEventListener('click', () => {
      mobileMenu.classList.add('hidden');
      mobileMenu.classList.remove('flex');
      document.body.style.overflow = '';
      mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />';
    });
  });

  // Логика окна городов
  const openCityModalBtn = document.getElementById('openCityModal');
  const openCityModalMobileBtn = document.getElementById('openCityModalMobile');
  const closeCityModalBtn = document.getElementById('closeCityModal');
  const cityModal = document.getElementById('cityModal');
  const citySearchInput = document.getElementById('citySearchInput');

  function toggleModal(show) {
    if (!cityModal) return;
    const inner = cityModal.querySelector('div');
    if (show) {
      cityModal.classList.remove('hidden');
      cityModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      setTimeout(() => {
        cityModal.classList.remove('opacity-0');
        inner.classList.remove('scale-95');
        citySearchInput?.focus();
      }, 10);
    } else {
      cityModal.classList.add('opacity-0');
      inner.classList.add('scale-95');
      setTimeout(() => {
        cityModal.classList.add('hidden');
        cityModal.classList.remove('flex');
        document.body.style.overflow = '';
      }, 300);
    }
  }

  openCityModalBtn?.addEventListener('click', () => toggleModal(true));
  openCityModalMobileBtn?.addEventListener('click', () => {
    mobileMenu.classList.add('hidden');
    mobileMenu.classList.remove('flex');
    document.body.style.overflow = '';
    mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />';
    toggleModal(true);
  });
  closeCityModalBtn?.addEventListener('click', () => toggleModal(false));

  cityModal?.addEventListener('click', (e) => {
    if (e.target === cityModal) toggleModal(false);
  });

  citySearchInput?.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    const items = document.querySelectorAll('.city-item');
    items.forEach(item => {
      if (item.textContent.toLowerCase().includes(val)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  });
</script>
