    </div>

      <div id="cityGridContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
        <div class="col-span-full text-center py-8 text-slate-500 text-sm">Загрузка городов...</div>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');
  const mobileLinks = document.querySelectorAll('.mobile-link');
  const mobileLeadBtn = document.getElementById('mobileLeadBtn');

  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
      });
    });

    if (mobileLeadBtn) {
      mobileLeadBtn.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
      });
    }
  }

  const cityModal = document.getElementById('cityModal');
  const openCityModalBtn = document.getElementById('openCityModal');
  const openCityModalMobileBtn = document.getElementById('openCityModalMobile');
  const closeCityModalBtn = document.getElementById('closeCityModal');
  const citySearchInput = document.getElementById('citySearchInput');
  const cityGridContainer = document.getElementById('cityGridContainer');

  let citiesData = null;
  let isCitiesLoaded = false;

  async function loadCities() {
    if (isCitiesLoaded) return;
    try {
      const response = await fetch('/cities.json');
      citiesData = await response.json();
      renderCities(citiesData);
      isCitiesLoaded = true;
    } catch (err) {
      if (cityGridContainer) {
        cityGridContainer.innerHTML = '<div class="col-span-full text-center text-red-400 text-sm">Ошибка загрузки списка городов</div>';
      }
    }
  }

  function renderCities(list) {
    if (!cityGridContainer) return;
    if (list.length === 0) {
      cityGridContainer.innerHTML = '<div class="col-span-full text-center text-slate-500 text-sm py-4">Город не найден</div>';
      return;
    }
    cityGridContainer.innerHTML = list.map(c => 
      `<a href="/geo/${c.slug}/" class="city-item p-2 rounded-lg bg-slate-800/40 border border-slate-700/50 hover:border-cdek text-sm text-slate-300 hover:text-cdek transition-all text-center font-medium">${c.name}</a>`
    ).join('');
  }

  function toggleModal(show) {
    if (cityModal) {
      if (show) {
        cityModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        loadCities();
        setTimeout(() => citySearchInput?.focus(), 100);
      } else {
        cityModal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }
  }

  openCityModalBtn?.addEventListener('click', () => toggleModal(true));
  openCityModalMobileBtn?.addEventListener('click', () => {
    mobileMenu.classList.add('hidden');
    toggleModal(true);
  });
  closeCityModalBtn?.addEventListener('click', () => toggleModal(false));
  
  cityModal?.addEventListener('click', (e) => {
    if (e.target === cityModal) toggleModal(false);
  });

  citySearchInput?.addEventListener('input', (e) => {
    if (!citiesData) return;
    const val = e.target.value.toLowerCase().trim();
    const filtered = citiesData.filter(c => c.name.toLowerCase().includes(val));
    renderCities(filtered);
  });
</script>
