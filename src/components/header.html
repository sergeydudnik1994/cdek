    <!-- Левая часть: Логотип -->
    <div class="flex items-center gap-4 sm:gap-6">
      <a href="/" class="flex items-center gap-2 group transition-transform hover:scale-105">
        <span class="text-xl sm:text-2xl font-black text-white tracking-tight">СДЭК <span class="text-cdek">Маркетплейсы</span></span>
      </a>
    </div>

    <!-- Правая часть: Навигация и Кнопка -->
    <div class="flex items-center gap-6">
      <nav class="hidden md:flex items-center gap-6">
        <a href="/calculator/" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Калькулятор</a>
        <a href="/#platforms" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Маркетплейсы</a>
        <a href="/blog/" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Блог</a>
        <a href="/faq/" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">ФАК</a>
      </nav>

      <a href="/#leadForm" class="hidden sm:inline-flex items-center justify-center px-5 py-2 text-sm font-extrabold text-[#0b101d] bg-cdek rounded-lg hover:bg-cdek/90 transition-all shadow-lg shadow-cdek/20">
        Подключиться
      </a>

      <!-- Кнопка мобильного меню (Гамбургер) -->
      <button id="mobileMenuBtn" type="button" class="md:hidden p-2 -mr-2 text-slate-400 hover:text-white transition-colors focus:outline-none cursor-pointer">
        <svg id="mobileMenuIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Мобильное меню (полноэкранное) -->
  <div id="mobileMenu" class="fixed inset-0 bg-[#0b101d] z-40 hidden flex-col pt-20 px-6 pb-6 overflow-y-auto">
    <div class="flex flex-col gap-6">
      <nav class="flex flex-col gap-4">
        <a href="/calculator/" class="text-lg font-bold text-slate-200 hover:text-cdek transition-colors">Калькулятор тарифов</a>
        <a href="/#platforms" class="text-lg font-bold text-slate-200 hover:text-cdek transition-colors">Схемы работы (FBS/DBS)</a>
        <a href="/blog/" class="text-lg font-bold text-slate-200 hover:text-cdek transition-colors">Блог селлера</a>
        <a href="/faq/" class="text-lg font-bold text-slate-200 hover:text-cdek transition-colors">Вопросы и ответы</a>
      </nav>

      <div class="h-px bg-slate-800 w-full"></div>

      <a href="/#leadForm" class="flex items-center justify-center w-full px-6 py-4 text-base font-extrabold text-[#0b101d] bg-cdek rounded-xl hover:bg-cdek/90 transition-all shadow-lg shadow-cdek/20">

  </div>

<script>
  const header = document.querySelector('header');
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  const mobileMenuIcon = document.getElementById('mobileMenuIcon');

  // Легкая тень для шапки при скролле
  window.addEventListener('scroll', () => {
    if (window.scrollY > 10) {
      header.classList.add('shadow-md');
    } else {
      header.classList.remove('shadow-md');
    }
  });

  // Открытие/закрытие мобильного меню
  mobileMenuBtn?.addEventListener('click', () => {
    const isHidden = mobileMenu.classList.contains('hidden');
    
    if (isHidden) {
      mobileMenu.classList.remove('hidden');
      mobileMenu.classList.add('flex');
      document.body.style.overflow = 'hidden'; // Блокируем скролл сайта
      mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />'; // Крестик
    } else {
      mobileMenu.classList.add('hidden');
      mobileMenu.classList.remove('flex');
      document.body.style.overflow = '';
      mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />'; // Гамбургер
    }
  });

  // Закрытие мобильного меню при клике на любую ссылку внутри
  const mobileLinks = mobileMenu.querySelectorAll('a');
  mobileLinks.forEach(link => {
    link.addEventListener('click', () => {
      mobileMenu.classList.add('hidden');
      mobileMenu.classList.remove('flex');
      document.body.style.overflow = '';
      mobileMenuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />';
    });
  });
</script>
