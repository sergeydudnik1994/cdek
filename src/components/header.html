<header class="sticky top-0 z-50 bg-[#0b101d]/95 backdrop-blur-md border-b border-slate-800 shadow-sm shadow-[#0b101d]/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Левая часть: Логотип, Выбор города и Режим работы -->
    <div class="flex items-center gap-4 sm:gap-6">
      <a href="/" class="flex items-center gap-2 group transition-transform hover:scale-105">
        <span class="text-xl sm:text-2xl font-black text-white tracking-tight">СДЭК <span class="text-cdek">Маркетплейсы</span></span>
      </a>

      <!-- Кнопка выбора города -->
      <button id="openCityModal" type="button" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/60 text-xs font-medium text-slate-200 hover:border-cdek/50 hover:text-white transition-all cursor-pointer">
        <svg class="w-3.5 h-3.5 text-cdek shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span id="currentCityLabel">Выбрать город</span>
        <svg class="w-3 h-3 text-slate-400 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </button>
      
      <!-- Часы работы (десктоп) -->
      <div class="hidden lg:flex flex-col border-l border-slate-700/50 pl-6">
        <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider mb-0.5">Отдел подключений</span>
        <div class="flex items-center gap-1.5 text-xs font-bold text-slate-200">
          <span class="w-1.5 h-1.5 rounded-full bg-cdek animate-pulse"></span>
          Пн-Пт: 09:00 — 18:00 (МСК)
        </div>
      </div>
    </div>

    <!-- Правая часть: Навигация и кнопки -->
    <div class="flex items-center gap-6">
      
      <!-- Навигация (десктоп) -->
      <nav class="hidden md:flex items-center gap-6">
        <a href="/calculator/" class="text-sm font-semibold transition-colors text-slate-300 hover:text-cdek">Калькулятор</a>
        <a href="/#platforms" class="text-sm font-semibold transition-colors text-slate-300 hover:text-cdek">Маркетплейсы</a>
        <a href="/blog/" class="text-sm font-semibold transition-colors text-slate-300 hover:text-cdek">Блог</a>
        <a href="/faq/" class="text-sm font-semibold transition-colors text-slate-300 hover:text-cdek">FAQ</a>
      </nav>

      <!-- Кнопка подключения (десктоп) -->
      <div class="hidden md:flex items-center">
        <a href="/#leadForm" class="inline-flex items-center justify-center py-2 px-5 bg-transparent border border-cdek text-cdek hover:bg-cdek hover:text-[#0b101d] font-bold text-sm rounded-lg transition-all shadow-[0_0_10px_rgba(141,226,26,0.1)] hover:shadow-[0_0_15px_rgba(141,226,26,0.3)]">
          Подключиться
        </a>
      </div>

      <!-- Кнопка мобильного меню (бургер) -->
      <button id="menuToggle" type="button" class="md:hidden flex items-center justify-center p-2 rounded-md border border-slate-700 text-slate-300 hover:text-cdek hover:border-cdek focus:outline-none transition-colors cursor-pointer" aria-label="Открыть меню">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

    </div>
  </div>

  <!-- Выпадающее мобильное меню -->
  <div id="mobileMenu" class="hidden md:hidden bg-[#0b101d]/95 backdrop-blur-lg border-b border-slate-800 px-6 pt-4 pb-6 shadow-xl">
    <!-- Кнопка выбора города для мобильных -->
    <div class="mb-4 pb-4 border-b border-slate-800/60">
      <button id="openCityModalMobile" type="button" class="w-full flex items-center justify-between py-2.5 px-4 rounded-lg bg-slate-800/50 border border-slate-700/60 text-sm font-medium text-slate-200">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-cdek" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
          <span class="mobileCityText">Выбрать город</span>
        </span>
        <span class="text-xs text-cdek font-bold">Изменить</span>
      </button>
    </div>

    <!-- Часы работы в мобильном меню -->
    <div class="flex flex-col items-start mb-6 pb-4 border-b border-slate-800/60">
      <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider mb-1">Отдел подключений</span>
      <div class="flex items-center gap-1.5 text-xs font-bold text-slate-200">
        <span class="w-1.5 h-1.5 rounded-full bg-cdek animate-pulse"></span>
        Пн-Пт: 09:00 — 18:00 (МСК)
      </div>
    </div>

    <nav class="space-y-2 mb-6">
      <a href="/calculator/" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">Калькулятор</a>
      <a href="/#platforms" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">Маркетплейсы</a>
      <a href="/blog/" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">Блог</a>
      <a href="/faq/" class="block py-3 px-4 rounded-lg text-base font-medium transition-colors text-slate-200 hover:bg-slate-800/30 hover:text-cdek">FAQ</a>
    </nav>
    
    <div>
      <a href="/#leadForm" class="flex items-center justify-center w-full py-3.5 bg-cdek hover:bg-cdek/90 text-[#0b101d] font-extrabold text-sm rounded-xl transition-all shadow-lg shadow-cdek/20">
        Заключить договор
      </a>
    </div>
  </div>
</header>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');

  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    mobileMenu.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
      });
    });
  }
</script>
