<div class="max-w-4xl mx-auto glass p-5 sm:p-6 rounded-3xl border border-slate-800 shadow-xl my-6">
  <div class="mb-4">
    <h3 class="text-xl sm:text-2xl font-black text-white tracking-tight">Калькулятор тарифов СДЭК</h3>
    <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
      Расчет стоимости и сроков доставки для селлеров маркетплейсов и интернет-магазинов
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <!-- Поля ввода -->
    <div class="space-y-3.5">
      <div class="relative">
        <label class="block text-[11px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">Город отправления</label>
        <input type="text" id="cdek-from" value="Москва" autocomplete="off" class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-cdek text-sm" />
        <ul id="list-from" class="absolute z-50 w-full bg-[#1e293b] border border-slate-700 rounded-xl mt-1 hidden max-h-48 overflow-y-auto shadow-2xl text-sm overflow-hidden"></ul>
      </div>

      <div class="relative">
        <label class="block text-[11px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">Город назначения</label>
        <input type="text" id="cdek-to" placeholder="Ростов-на-Дону" autocomplete="off" class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-cdek text-sm" />
        <ul id="list-to" class="absolute z-50 w-full bg-[#1e293b] border border-slate-700 rounded-xl mt-1 hidden max-h-48 overflow-y-auto shadow-2xl text-sm overflow-hidden"></ul>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">Вес (до 50 кг)</label>
          <div class="relative flex items-center">
            <input type="number" id="cdek-weight" value="1" min="1" max="50" step="1" class="w-full pl-3.5 pr-14 py-2.5 bg-[#0f172a] border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cdek text-sm [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" />
            <div class="absolute right-1.5 flex flex-col items-center justify-center gap-0.5">
              <button type="button" id="weight-inc" class="w-6 h-4 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-md flex items-center justify-center text-[10px] transition-colors cursor-pointer">▲</button>
              <button type="button" id="weight-dec" class="w-6 h-4 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-md flex items-center justify-center text-[10px] transition-colors cursor-pointer">▼</button>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">Режим доставки</label>
          <div class="relative flex items-center">
            <select id="cdek-mode" class="w-full pl-3.5 pr-10 py-2.5 bg-[#0f172a] border border-slate-700 rounded-xl text-white focus:outline-none focus:border-cdek text-sm cursor-pointer appearance-none">
              <option value="warehouse">Склад — Склад</option>
              <option value="door">Склад — Дверь</option>
            </select>
            <div class="absolute right-3 flex items-center justify-center pointer-events-none text-slate-400 text-xs">▼</div>
          </div>
        </div>
      </div>

      <button type="button" id="calc-btn" class="w-full py-3 px-5 bg-cdek hover:bg-cdek/90 text-[#0f172a] font-extrabold rounded-xl transition-all shadow-[0_0_15px_rgba(141,226,26,0.3)] cursor-pointer text-sm uppercase tracking-wider mt-1">
        Рассчитать стоимость
      </button>
    </div>

    <!-- Блок результатов -->
    <div class="bg-[#0f172a]/80 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between relative z-0">
      <div>
        <h4 class="text-white font-bold text-sm mb-3 border-b border-slate-800 pb-2">Результаты расчета</h4>
        <div id="calc-results" class="space-y-2.5 text-sm text-slate-300">
          <p class="text-slate-500 italic text-xs">Заполните города и нажмите «Рассчитать стоимость»</p>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-slate-800/80">
        <p class="text-[11px] text-slate-400 leading-relaxed">
          Нужен <span class="text-white font-semibold">точный расчет</span> с учетом персональной скидки? 
          <a href="#leadForm" id="lead-scroll-link" class="text-cdek hover:underline font-medium cursor-pointer">Оставьте заявку на точный расчёт тарифов.</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const weightInput = document.getElementById('cdek-weight');
    const weightInc = document.getElementById('weight-inc');
    const weightDec = document.getElementById('weight-dec');

    if (weightInc && weightDec && weightInput) {
      weightInc.addEventListener('click', () => {
        let val = parseInt(weightInput.value) || 0;
        if (val < 50) weightInput.value = val + 1;
      });
      weightDec.addEventListener('click', () => {
        let val = parseInt(weightInput.value) || 1;
        if (val > 1) weightInput.value = val - 1;
      });
    }

    const topCities = [
      "Москва", "Санкт-Петербург", "Новосибирск", "Екатеринбург", "Казань", "Нижний Новгород", "Красноярск", "Челябинск", 
      "Самара", "Уфа", "Ростов-на-Дону", "Омск", "Краснодар", "Воронеж", "Пермь", "Волгоград", "Саратов", "Тюмень"
    ];

    function setupAutocomplete(inputId, listId) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);

      input.addEventListener('input', function() {
        const val = this.value.trim().toLowerCase();
        list.innerHTML = '';
        if (!val) { list.classList.add('hidden'); return; }

        const filtered = topCities.filter(city => city.toLowerCase().includes(val));
        if (filtered.length === 0) { list.classList.add('hidden'); return; }

        filtered.forEach(city => {
          const li = document.createElement('li');
          li.className = 'px-3.5 py-2.5 cursor-pointer hover:bg-cdek hover:text-[#0f172a] text-white border-b border-slate-700/50 last:border-0 transition-colors';
          const regex = new RegExp(`(${val})`, 'gi');
          li.innerHTML = city.replace(regex, '<span class="font-bold text-cdek group-hover:text-[#0f172a]">$1</span>');
          li.addEventListener('click', () => {
            input.value = city;
            list.classList.add('hidden');
          });
          list.appendChild(li);
        });
        list.classList.remove('hidden');
      });

      document.addEventListener('click', (e) => {
        if (e.target !== input && e.target !== list) list.classList.add('hidden');
      });
    }

    setupAutocomplete('cdek-from', 'list-from');
    setupAutocomplete('cdek-to', 'list-to');

    const btn = document.getElementById('calc-btn');
    const resultsContainer = document.getElementById('calc-results');

    if (btn) {
      btn.addEventListener('click', async () => {
        const cityFrom = document.getElementById('cdek-from').value.trim();
        const cityTo = document.getElementById('cdek-to').value.trim();
        const weightKg = parseFloat(weightInput.value) || 1;
        const mode = document.getElementById('cdek-mode').value; // 'warehouse' или 'door'

        if (!cityFrom || !cityTo) {
          alert('Пожалуйста, заполните город отправления и назначения');
          return;
        }

        // Стабильные тарифы СДЭК для посылок до 50 кг: 136 (склад-склад) и 137 (склад-дверь)
        const tariffCode = (mode === 'door') ? 137 : 136;

        btn.disabled = true;
        btn.innerText = 'Запрос к API СДЭК...';
        resultsContainer.innerHTML = '<p class="text-cdek animate-pulse text-xs">Получение точного расчета...</p>';

        try {
          const response = await fetch('/cdek-service.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cityFrom: cityFrom,
              cityTo: cityTo,
              tariffCode: tariffCode, 
              goods: [{ weight: weightKg * 1000, length: 10, width: 10, height: 10 }]
            })
          });

          const data = await response.json();

          if (response.ok && data.result) {
            const res = data.result;
            const finalPrice = Math.round(res.price);
            resultsContainer.innerHTML = `
              <div class="flex justify-between items-center py-1.5 border-b border-slate-800 text-xs sm:text-sm">
                <span class="text-slate-400">Направление:</span>
                <span class="text-white font-bold">${cityFrom} → ${cityTo}</span>
              </div>
              <div class="flex justify-between items-center py-1.5 border-b border-slate-800 text-xs sm:text-sm">
                <span class="text-slate-400">Срок доставки:</span>
                <span class="text-white font-bold">${res.deliveryPeriodMin}–${res.deliveryPeriodMax} раб. дней</span>
              </div>
              <div class="flex justify-between items-center py-1.5 text-xs sm:text-sm">
                <span class="text-slate-400">Стоимость:</span>
                <span class="text-cdek font-black text-lg sm:text-xl">${finalPrice} ₽</span>
              </div>
            `;
          } else {
            const errorMsg = data.error || 'Ошибка бэкенда';
            const detailsMsg = data.details ? JSON.stringify(data.details) : '';
            resultsContainer.innerHTML = `
              <div class="text-red-400 text-xs space-y-1">
                <p><strong>${errorMsg}</strong></p>
                ${detailsMsg ? `<p class="text-[10px] text-slate-400 break-all">${detailsMsg}</p>` : ''}
              </div>
            `;
          }
        } catch (error) {
          resultsContainer.innerHTML = `<p class="text-red-400 text-xs">Не удалось подключиться к серверу расчета: ${error.message}</p>`;
        } finally {
          btn.disabled = false;
          btn.innerText = 'Рассчитать стоимость';
        }
      });
    }

    const leadLink = document.getElementById('lead-scroll-link');
    if (leadLink) {
      leadLink.addEventListener('click', (e) => {
        e.preventDefault();
        const target = document.getElementById('leadForm');
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          window.location.hash = '#leadForm';
        }
      });
    }
  });
</script>
